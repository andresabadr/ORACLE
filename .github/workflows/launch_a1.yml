name: Launch A1 Instance

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - name: Configure OCI CLI
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_KEY_CONTENT }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          cat <<EOF > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          key_file=/home/runner/.oci/oci_api_key.pem
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          EOF
          chmod 600 ~/.oci/config

      - name: Install OCI CLI
        run: |
          bash -c "$(curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh)" -- --accept-all-defaults
          echo "/home/runner/bin" >> $GITHUB_PATH

      - name: Attempt Instance Launch
        run: |
          export PATH="/home/runner/bin:$PATH"
          export OCI_TENANCY="${{ secrets.OCI_TENANCY_OCID }}"
          
          # Check if instance already exists
          EXISTING=$(oci compute instance list --compartment-id "$OCI_TENANCY" --lifecycle-state RUNNING --query "data[?contains(\"display-name\", 'instance-20260923-0114')].id" --raw-output)
          if [ -n "$EXISTING" ]; then
            echo "Instance already exists and is running. Exiting."
            exit 0
          fi

          python3 - <<'EOF'
          import json, os, subprocess, sys, time

          def run(cmd):
              res = subprocess.run(cmd, shell=True, capture_output=True, text=True)
              return res.returncode, res.stdout, res.stderr

          tenancy_id = os.environ.get("OCI_TENANCY")
          
          # Injects both the web-generated key and your local machine's id_ed25519 key
          ssh_keys = (
              "ssh-rsa \n"
              "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILnq6iEl/mbWSO+k+cbNJhXi72vT4BP8ZAovHxN2KqVw oracle-openclaw\n"
          )

          key_path = os.path.expanduser("/tmp/instance_key.pub")
          with open(key_path, "w") as f:
              f.write(ssh_keys)

          # Discover Subnet
          _, out, _ = run(f'oci network subnet list --compartment-id {tenancy_id} --display-name "subnet-20260325-2112" --query "data[0].id" --raw-output')
          subnet_id = out.strip()
          if not subnet_id or subnet_id == "None":
              _, out, _ = run(f'oci network subnet list --compartment-id {tenancy_id} --query "data[0].id" --raw-output')
              subnet_id = out.strip()

          # Discover Image
          _, out, _ = run(
              f'oci compute image list --compartment-id {tenancy_id} --shape VM.Standard.A1.Flex '
              f'--operating-system "Oracle Linux" --operating-system-version "9" '
              f'--sort-by TIMECREATED --sort-order DESC --query "data[0].id" --raw-output'
          )
          image_id = out.strip()

          # Discover ADs
          _, out, _ = run(f'oci iam availability-domain list --compartment-id {tenancy_id} --query "data[].name" --output json')
          ads = json.loads(out)

          shape_config = json.dumps({"ocpus": 2, "memoryInGBs": 12})
          instance_name = "instance-20260923-0114"

          # Loop for up to 10 minutes per workflow run (retrying every 25s)
          start_time = time.time()
          max_duration_seconds = 600

          round_num = 1
          while time.time() - start_time < max_duration_seconds:
              print(f"=== Round {round_num} ===")
              for ad in ads:
                  print(f"Trying launch in {ad}...")
                  cmd = (
                      f'oci compute instance launch '
                      f'--availability-domain "{ad}" '
                      f'--compartment-id "{tenancy_id}" '
                      f'--display-name "{instance_name}" '
                      f'--image-id "{image_id}" '
                      f'--shape "VM.Standard.A1.Flex" '
                      f'--shape-config \'{shape_config}\' '
                      f'--subnet-id "{subnet_id}" '
                      f'--boot-volume-size-in-gbs 50 '
                      f'--boot-volume-vpus-per-gb 10 '
                      f'--assign-public-ip true '
                      f'--ssh-authorized-keys-file "{key_path}"'
                  )
                  code, stdout, stderr = run(cmd)
                  if code == 0:
                      print("SUCCESS: Instance created!")
                      print(stdout)
                      sys.exit(0)
                  
                  err_msg = stderr.strip() if stderr else stdout.strip()
                  if "Out of host capacity" in err_msg or "TooManyRequests" in err_msg:
                      print(f"  -> Capacity unavailable in {ad}")
                  else:
                      print(f"  -> Response: {err_msg[:120]}")
                  time.sleep(3)

              round_num += 1
              print("Waiting 25s before next attempt round...\n")
              time.sleep(25)

          print("Timeout for this run reached. Next scheduled workflow will continue trying.")
          EOF
